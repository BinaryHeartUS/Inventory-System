name: inventory-e2e

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: inventory
      POSTGRES_USER: binaryheart
      POSTGRES_PASSWORD: e2e_db_password
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./frontend/e2e/seed:/e2e:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U binaryheart -d inventory"]
      interval: 2s
      timeout: 5s
      retries: 30

  db-migrate:
    platform: linux/amd64
    build:
      context: ./sql
      dockerfile: Dockerfile.migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      FLYWAY_URL: jdbc:postgresql://db:5432/inventory
      FLYWAY_USER: binaryheart
      FLYWAY_PASSWORD: e2e_db_password
      FLYWAY_LOCATIONS: "filesystem:/flyway/sql/010 - Tracked,filesystem:/flyway/sql/020 - Untracked - Procedures & Functions,filesystem:/flyway/sql/030 - Untracked - Triggers,filesystem:/flyway/sql/040 - Untracked - Views,filesystem:/flyway/sql/callbacks,filesystem:/flyway/e2e"
      FLYWAY_PLACEHOLDERS_API_USER_PASSWORD: e2e_api_password
      FLYWAY_PLACEHOLDERS_IMPORTER_PASSWORD: e2e_importer_password
    volumes:
      - ./frontend/e2e/seed:/flyway/e2e:ro
    command: ["migrate"]

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment:
      DB_URL: jdbc:postgresql://db:5432/inventory
      DB_USER: api_user
      DB_PASSWORD: e2e_api_password
      AUTH_ISSUER: http://127.0.0.1:${E2E_AUTH_PORT:-4174}
      AUTH_JWKS_URL: http://auth:8080/.well-known/jwks.json
      STUCK_DEVICE_THRESHOLD_DAYS: 14
      STUCK_DEVICE_SCAN_INTERVAL_HOURS: 24

  auth:
    image: node:22-alpine
    environment:
      AUTH_ISSUER: http://127.0.0.1:${E2E_AUTH_PORT:-4174}
      INVENTORY_ORIGIN: http://127.0.0.1:${E2E_PORT:-4173}
    volumes:
      - ./frontend/e2e/fixtures/oauth-server.mjs:/app/oauth-server.mjs:ro
    command: ["node", "/app/oauth-server.mjs"]
    ports:
      - "127.0.0.1:${E2E_AUTH_PORT:-4174}:8080"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/.well-known/jwks.json').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${E2E_PORT:-4173}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/api/health/ready | grep -q OK"]
      interval: 2s
      timeout: 5s
      retries: 60